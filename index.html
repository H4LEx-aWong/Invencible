<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mano invisible</title>
<style>
  html,body{margin:0;height:100%;background:#000;overflow:hidden;font-family:system-ui,-apple-system,sans-serif;color:#fff}
  #lienzo{position:fixed;inset:0;width:100%;height:100%;object-fit:cover}
  video{display:none}
  #estado{position:fixed;top:calc(12px + env(safe-area-inset-top));left:16px;right:16px;text-align:center;
    font-size:15px;background:rgba(0,0,0,.5);padding:8px 12px;border-radius:12px;transition:opacity .4s}
  #inicio{position:fixed;inset:0;display:none;flex-direction:column;gap:16px;align-items:center;justify-content:center;
    background:#0b0b0f;text-align:center;padding:24px}
  #inicio button{font:inherit;font-size:16px;border:0;border-radius:999px;padding:14px 22px;background:#fff;color:#111;font-weight:600}
</style>
</head>
<body>
<video id="video" playsinline muted autoplay></video>
<canvas id="lienzo"></canvas>
<div id="estado">Cargando…</div>
<div id="inicio">
  <p>Toca para activar la cámara</p>
  <button id="btnIniciar">Iniciar</button>
</div>

<script type="module">
import { HandLandmarker, FilesetResolver } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14";

// ---------- Ajustes ----------
// MediaPipe etiqueta las manos como si la imagen estuviera en espejo.
// Con la cámara frontal sin voltear, tu mano DERECHA sale como "Left".
// Si en tu celular reacciona la mano equivocada, cambia esto a "Right".
const ETIQUETA_MANO_DERECHA = "Left";
const PINZA_CIERRA = 0.28;  // dedos juntos  (proporción del tamaño de la mano)
const PINZA_ABRE   = 0.42;  // dedos separados (histéresis para que no parpadee)
const PULGAR = 4, INDICE = 8;

const video = document.getElementById("video");
const lienzo = document.getElementById("lienzo");
const ctx = lienzo.getContext("2d");
const estado = document.getElementById("estado");

// fondo: se aprende solo con los píxeles donde NO hay manos
const fondo = document.createElement("canvas"), fctx = fondo.getContext("2d");
const temp = document.createElement("canvas"), tctx = temp.getContext("2d");
const mascara = document.createElement("canvas"), mctx = mascara.getContext("2d");

let detector, ultimoTiempoVideo = -1;
let manos = [], derecha = null, ultimaVezDerecha = 0;
let pinza = false, ocultaDesde = 0;

const ponerEstado = (t, ocultar = false) => {
  estado.textContent = t; estado.style.opacity = 1;
  if (ocultar) setTimeout(() => estado.style.opacity = 0, 2500);
};

async function crearDetector() {
  const vision = await FilesetResolver.forVisionTasks(
    "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm");
  const op = (delegate) => ({
    baseOptions: {
      modelAssetPath: "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task",
      delegate
    },
    runningMode: "VIDEO", numHands: 2,
    minHandDetectionConfidence: 0.5, minTrackingConfidence: 0.5
  });
  try { return await HandLandmarker.createFromOptions(vision, op("GPU")); }
  catch { return await HandLandmarker.createFromOptions(vision, op("CPU")); }
}

async function iniciar() {
  const stream = await navigator.mediaDevices.getUserMedia({
    video: { facingMode: "user", width: { ideal: 960 }, height: { ideal: 540 } }, audio: false
  });
  video.srcObject = stream;
  await video.play();
}

// Arranca solo; si el navegador exige un toque, muestra el botón
(async () => {
  try {
    ponerEstado("Cargando…");
    const det = crearDetector();
    await iniciar();
    detector = await det;
    listo();
  } catch {
    document.getElementById("inicio").style.display = "flex";
  }
})();
document.getElementById("btnIniciar").onclick = async () => {
  document.getElementById("inicio").style.display = "none";
  try {
    ponerEstado("Cargando…");
    const det = detector ? Promise.resolve(detector) : crearDetector();
    await iniciar();
    detector = await det;
    listo();
  } catch (e) {
    ponerEstado("No se pudo abrir la cámara: " + e.message + " (la página debe estar en HTTPS)");
  }
};
function listo() {
  ponerEstado("Mueve tu mano un poco por la pantalla y luego junta pulgar e índice", true);
  requestAnimationFrame(bucle);
}

// ---------- Utilidades ----------
const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
const tamano = m => dist(m[0], m[9]);

function aPixeles(mano) {
  const w = lienzo.width, h = lienzo.height;
  return mano.map(p => ({ x: (1 - p.x) * w, y: p.y * h })); // espejo
}

function envolvente(puntos) {
  const p = [...puntos].sort((a, b) => a.x - b.x || a.y - b.y);
  const cruz = (o, a, b) => (a.x - o.x) * (b.y - o.y) - (a.y - o.y) * (b.x - o.x);
  const inf = [], sup = [];
  for (const q of p) { while (inf.length >= 2 && cruz(inf.at(-2), inf.at(-1), q) <= 0) inf.pop(); inf.push(q); }
  for (const q of p.reverse()) { while (sup.length >= 2 && cruz(sup.at(-2), sup.at(-1), q) <= 0) sup.pop(); sup.push(q); }
  return inf.slice(0, -1).concat(sup.slice(0, -1));
}

// Contorno de la mano + un tramo de muñeca/antebrazo
function contorno(m) {
  const s = tamano(m);
  const dx = (m[0].x - m[9].x) / s, dy = (m[0].y - m[9].y) / s;
  const brazo = { x: m[0].x + dx * s * 0.9, y: m[0].y + dy * s * 0.9 };
  return envolvente([...m, brazo]);
}

function trazarManos(c, lista, margen) {
  c.fillStyle = c.strokeStyle = "#fff";
  c.lineJoin = c.lineCap = "round";
  for (const m of lista) {
    const pts = contorno(m);
    c.lineWidth = tamano(m) * margen;
    c.beginPath();
    pts.forEach((p, i) => i ? c.lineTo(p.x, p.y) : c.moveTo(p.x, p.y));
    c.closePath(); c.fill(); c.stroke();
  }
}

// ---------- Bucle ----------
function bucle() {
  requestAnimationFrame(bucle);
  if (video.readyState < 2) return;

  const w = video.videoWidth, h = video.videoHeight;
  if (lienzo.width !== w || lienzo.height !== h) {
    for (const c of [lienzo, fondo, temp, mascara]) { c.width = w; c.height = h; }
  }

  // 1) Cuadro actual en espejo
  ctx.save(); ctx.translate(w, 0); ctx.scale(-1, 1);
  ctx.drawImage(video, 0, 0, w, h);
  ctx.restore();

  // 2) Detectar manos y quedarse con la derecha
  const ahora = performance.now();
  if (video.currentTime !== ultimoTiempoVideo) {
    ultimoTiempoVideo = video.currentTime;
    const r = detector.detectForVideo(video, ahora);
    manos = []; let d = null;
    (r.landmarks || []).forEach((lm, i) => {
      const px = aPixeles(lm);
      manos.push(px);
      const lado = r.handedness?.[i]?.[0]?.categoryName;
      if (lado === ETIQUETA_MANO_DERECHA) d = px;
    });
    if (d) { derecha = d; ultimaVezDerecha = ahora; }
  }
  const hayDerecha = ahora - ultimaVezDerecha < 300;

  // 3) Aprender el fondo: copiar el cuadro excepto donde hay manos
  tctx.globalCompositeOperation = "source-over";
  tctx.clearRect(0, 0, w, h);
  tctx.drawImage(lienzo, 0, 0);
  const excluir = hayDerecha ? [...manos, derecha] : manos;
  if (excluir.length) {
    tctx.globalCompositeOperation = "destination-out";
    trazarManos(tctx, excluir, 1.0);   // margen amplio para no "ensuciar" el fondo
    tctx.globalCompositeOperation = "source-over";
  }
  fctx.drawImage(temp, 0, 0);

  // 4) ¿Pulgar e índice juntos?
  if (hayDerecha) {
    const s = tamano(derecha), d = dist(derecha[PULGAR], derecha[INDICE]) / s;
    if (!pinza && d < PINZA_CIERRA) pinza = true;
    else if (pinza && d > PINZA_ABRE) pinza = false;
  } else if (ahora - ultimaVezDerecha > 600) {
    pinza = false;
  }

  // 5) Efecto
  if (pinza && hayDerecha) {
    mctx.globalCompositeOperation = "source-over";
    mctx.clearRect(0, 0, w, h);
    mctx.filter = "blur(10px)";
    trazarManos(mctx, [derecha], 0.75);
    mctx.filter = "none";
    mctx.globalCompositeOperation = "source-in";
    mctx.drawImage(fondo, 0, 0);
    ctx.drawImage(mascara, 0, 0);
  } else if (hayDerecha) {
    const s = tamano(derecha), p = derecha[PULGAR], i = derecha[INDICE];
    ctx.strokeStyle = "#00e5ff"; ctx.lineWidth = Math.max(3, s * 0.06);
    ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(i.x, i.y); ctx.stroke();
    for (const q of [p, i]) {
      ctx.beginPath(); ctx.arc(q.x, q.y, Math.max(8, s * 0.12), 0, Math.PI * 2);
      ctx.fillStyle = "#00e5ff"; ctx.fill();
      ctx.lineWidth = 3; ctx.strokeStyle = "#fff"; ctx.stroke();
    }
  }
}
</script>
</body>
</html>
